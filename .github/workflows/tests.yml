name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Lint the Python
        run: ruff check .

      # Coverage only needs one Python: it measures which lines the tests
      # reach, not which interpreter they run on.
      - name: Check test coverage
        if: matrix.python-version == '3.12'
        run: |
          coverage run -m pytest tests/ -q
          coverage report

      - name: Install zsh
        run: sudo apt-get install -y zsh

      - name: Check shell scripts
        run: |
          zsh -n clishe-bind.zsh
          bash -n clishe.sh install.sh clishe-bind.bash
          shellcheck -S warning clishe.sh clishe-bind.bash install.sh \
            tests/test_shell_functions.sh tests/stop_practice.sh

      - name: Check Python syntax
        run: |
          python -m py_compile *.py providers/*.py

      - name: Run shell-level regression tests
        run: bash tests/test_shell_functions.sh

      - name: Run zsh shortcut tests
        run: zsh tests/test_zsh_bind.zsh

      - name: Install as a package and run it
        run: |
          pip install .
          cd /tmp
          clishe --version
          test "$(clishe 'show me disk usage')" = "df -h"
          clishe explain tar -xzvf | grep -q "extract"
          # The Ctrl+G binding is what a packaging change breaks most often.
          clishe --init bash | grep -q clishe-bind.bash
          clishe --init zsh | grep -q clishe-bind.zsh
          # The data files and the man page have to ship too.
          python -c "import clishe, pathlib; p = pathlib.Path(list(clishe.__path__)[0]); \
            [(_ for _ in ()).throw(AssertionError(f)) for f in ['clishe.1', 'clishe.sh', \
            'seed_kb.json', 'tldr.json.gz', 'lessons/basics.json', 'providers/base.py'] \
            if not (p / f).exists()]"

  # macOS ships bash 3.2 and BSD tools: run everything there too, so Clishe
  # keeps working for Mac users.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Lint the Python
        run: ruff check .

      - name: Check the shell scripts
        run: |
          zsh -n clishe-bind.zsh
          bash -n clishe.sh install.sh clishe-bind.bash
          brew install shellcheck
          shellcheck -S warning clishe.sh clishe-bind.bash install.sh \
            tests/test_shell_functions.sh tests/stop_practice.sh

      - name: Run shell-level regression tests with the system bash (3.2)
        run: /bin/bash tests/test_shell_functions.sh

      - name: Run zsh shortcut tests
        run: zsh tests/test_zsh_bind.zsh
