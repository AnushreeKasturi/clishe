[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clishe"
version = "0.8.0"
description = "Plain English to shell commands for Linux beginners: offline-first, learn as you go, optional local AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sym-jay"}]
keywords = ["cli", "linux", "shell", "beginner", "ai", "assistant"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
    "Topic :: Education",
]
# Intentionally empty: the core (KB, prediction, provider dispatch) is
# stdlib-only by design so `clishe` runs with nothing but Python 3 and bash.
dependencies = []

[project.scripts]
clishe = "clishe.launch:main"

[project.urls]
Homepage = "https://github.com/Sym-jay/clishe"
Issues = "https://github.com/Sym-jay/clishe/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# The repo is a flat folder of scripts that find each other by location
# (clishe.sh runs clishe_brain.py next to it, which imports config.py and
# reads the .json files next to it). Installed, the whole folder becomes the
# "clishe" package, so everything stays side by side.
[tool.setuptools]
package-dir = {"clishe" = ".", "clishe.providers" = "providers"}
packages = ["clishe", "clishe.providers"]

[tool.setuptools.package-data]
clishe = ["clishe.sh", "clishe-bind.bash", "clishe-bind.zsh", "clishe.1", "*.json", "*.json.gz", "lessons/*.json"]
